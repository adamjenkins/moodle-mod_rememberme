name: Moodle Plugin CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        # Pinned to the MINIMUM PostgreSQL that Moodle 5.2 accepts, so that a
        # dependency on anything newer fails here rather than on a site. The
        # MOODLE_503_STABLE rows override it: 5.3 needs PostgreSQL 17
        # (environment.xml 5.3 block).
        image: ${{ matrix.database == 'pgsql' && (matrix.pgsql-image || 'postgres:16') || '' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        # Likewise the minimum MariaDB for 5.2; MOODLE_503_STABLE needs MariaDB 11.4
        # (environment.xml 5.3 block) and overrides it via the matrix.
        image: ${{ matrix.database == 'mariadb' && (matrix.mariadb-image || 'mariadb:10.11') || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        # version.php declares supported = [502, 503]. The base rows test
        # MOODLE_502_STABLE; 5.3 is covered by the MOODLE_503_STABLE rows in
        # include: below. All rows are blocking.
        # The plugin depends on 5.x-shaped question bank APIs (banks as
        # mod_qbank instances, question_bank_entries as the stable identity).
        #
        # PHP 8.3 is the floor because the 5.2 environment.xml requires 8.3.0;
        # 8.4 is the ceiling core itself tests on that branch. PHP 8.2 is
        # deliberately absent rather than excluded: it cannot install at all.
        php: ['8.3', '8.4']
        moodle-branch: ['MOODLE_502_STABLE']
        database: [pgsql, mariadb]
        # MOODLE_503_STABLE (environment.xml 5.3 block): PHP 8.3-8.4,
        # MariaDB >= 11.4.0, PostgreSQL >= 17. Blocking.
        include:
          - php: '8.4'
            moodle-branch: 'MOODLE_503_STABLE'
            database: pgsql
            pgsql-image: 'postgres:17'
            mariadb-image: 'mariadb:11.4'
          - php: '8.3'
            moodle-branch: 'MOODLE_503_STABLE'
            database: mariadb
            pgsql-image: 'postgres:17'
            mariadb-image: 'mariadb:11.4'

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Copy/Paste Detector
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcpd

      - name: PHP Mess Detector
        continue-on-error: true # This step will show errors but will not fail
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        # Not on MOODLE_503_STABLE: committed amd/build bundles are built with
        # the 5.2 toolchain, and each branch minifies differently.
        if: ${{ !cancelled() && matrix.moodle-branch != 'MOODLE_503_STABLE' }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      # There is deliberately no Behat step: this plugin ships no feature files,
      # so the step would run zero scenarios and report green without having
      # tested anything. Restore the upstream Behat and faildump-upload steps in
      # the same commit that adds the first .feature file.

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1
