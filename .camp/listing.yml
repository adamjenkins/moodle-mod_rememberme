name: mod_rememberme
summary: 'A Moodle activity that schedules spaced repetition of question bank items, driven by whether each answer was graded correct.'
description: |
  Learners revisit each question bank item just before they are likely to
  forget it. Scheduling uses an FSRS-style memory model, and the rating comes
  from Moodle's own question grading rather than learner self-assessment, so
  it works with real question types such as multiple choice, short answer,
  matching and cloze. Teachers bind question categories as ordered bands that
  unlock per learner. For teachers who want ongoing retrieval practice from
  an existing question bank on Moodle 5.2 and later.
